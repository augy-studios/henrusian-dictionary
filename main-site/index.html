<!doctype html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCYFTFPEL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'G-FMCYFTFPEL');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9715826188316382"
        crossorigin="anonymous"></script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Henrusian Dictionary | UwU Apps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Henrusian dictionary, at your fingertips!">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Henrusian Dictionary | UwU Apps" />
    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="The Henrusian dictionary, at your fingertips!" />

    <script>
        (function () {
            var k = "henrusian";
            var m = localStorage.getItem(k + ".mode") || "light";
            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    <link rel="stylesheet" href="/style.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/hrd-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/hrd-main.png">
    <meta property="og:image" content="/hrd-main.png" />
</head>

<body>
    <!-- Header -->
    <header class="glass-header">
        <div class="header-inner">
            <div class="brand">
                <span class="brand-icon">
                    <img src="/hrd-main.png" alt="Henrusian Dictionary logo" class="brand-logo">
                </span>
                <h1 class="brand-title">Henrusian Dictionary <span class="edition-pill">15th Edition</span></h1>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="favsBtn" type="button" title="My Favourites" aria-label="My Favourites">
                    <span data-icon="star"></span>
                </button>
                <a class="btn-icon" href="/link" title="Sync with Telegram" aria-label="Sync with Telegram">
                    <span data-icon="send"></span>
                </a>
                <a class="btn-icon btn-coffee" href="https://donate.stripe.com/28o2akeAr3hv0DK6oo" target="_blank" rel="noopener noreferrer" title="Buy Augy a Coffee" aria-label="Buy Augy a Coffee">
                    <span data-icon="coffee"></span>
                </a>
                <button class="btn-icon" id="themeBtn" type="button" title="Theme" aria-label="Theme">
                    <span data-icon="sun"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Search -->
    <section class="hero">
        <div class="hero-inner">
            <p class="hero-sub">Search the Henrusian language</p>
            <div class="search-wrapper glass-card">
                <span class="search-icon" data-icon="search"></span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search words, idioms, names..."
                    autocomplete="off" spellcheck="false" />
                <button class="btn-clear" id="clearBtn" type="button" title="Clear search" aria-label="Clear">
                    <span data-icon="close"></span>
                </button>
            </div>

            <!-- Tab Nav -->
            <nav class="tab-nav" role="tablist">
                <button class="tab-btn active" data-tab="dict" role="tab" aria-selected="true">Words</button>
                <button class="tab-btn" data-tab="idioms" role="tab" aria-selected="false">Idioms</button>
                <button class="tab-btn" data-tab="names" role="tab" aria-selected="false">Names</button>
            </nav>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <div class="results-header">
            <span class="results-count" id="resultsCount">Loading...</span>
            <button class="btn-sort" id="sortBtn" type="button" title="Toggle sort"></button>
        </div>

        <div class="entries-grid" id="entriesGrid">
            <!-- Populated by JS -->
        </div>

        <div class="pagination hidden" id="pagination"></div>

        <div class="empty-state hidden" id="emptyState">
            <span class="empty-icon" data-icon="leaf"></span>
            <p>No entries found.</p>
        </div>

        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>Fetching entries...</p>
        </div>
    </main>

    <!-- Entry Detail Modal -->
    <div class="modal-backdrop hidden" id="entryModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalWord">
            <button class="icon-btn small modal-close" id="entryModalClose" type="button" aria-label="Close">
                <span data-icon="close"></span>
            </button>
            <button class="icon-btn small modal-star" id="entryModalStar" type="button" aria-label="Add to favourites">
                <span data-icon="star"></span>
            </button>
            <div class="modal-tag" id="modalTag"></div>
            <div class="modal-word-row">
                <h2 class="modal-word" id="modalWord"></h2>
                <button class="btn-copy" id="copyWordBtn" type="button" aria-label="Copy word">
                    <span data-icon="copy"></span>
                </button>
            </div>
            <div class="modal-divider"></div>
            <div class="modal-def-row">
                <p class="modal-definition" id="modalDefinition"></p>
                <button class="btn-copy" id="copyDefBtn" type="button" aria-label="Copy definition">
                    <span data-icon="copy"></span>
                </button>
            </div>
            <div class="modal-meta" id="modalMeta"></div>
        </div>
    </div>

    <!-- Favourites Modal -->
    <div class="modal-backdrop hidden" id="favsModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="favsModalTitle">
            <button class="icon-btn small modal-close" id="favsModalClose" type="button" aria-label="Close">
                <span data-icon="close"></span>
            </button>
            <h2 class="modal-title" id="favsModalTitle">My Favourites</h2>
            <p class="modal-subtitle" id="favsModalSubtitle"></p>
            <div class="favs-list" id="favsList">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <!-- Theme Modal -->
    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span>Light</button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span>Dark</button>
            </div>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/sync.js"></script>
    <script src="/script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

</body>

</html>
